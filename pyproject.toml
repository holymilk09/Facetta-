[project]
name = "facetta"
version = "0.1.0"
description = "AI jewelry-design Studio with review-first generation, immutable revision history, and optional factory-review preparation."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.115.1",
    "cairosvg>=2.9.0",
    "fastapi>=0.115",
    "pillow>=11.1",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pyjwt[crypto]==2.13.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx[http2]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facetta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
