[project]
name = "facetta"
version = "0.1.0"
description = "Design-to-manufacturing platform for the jewelry industry: structured specs in, factory-ready outputs out."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.115.1",
    "cairosvg>=2.9.0",
    "fastapi>=0.115",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facetta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
